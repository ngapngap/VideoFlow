name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (svelte-check + build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: videoflow-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: videoflow-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

  rust:
    name: Rust (clippy + tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: videoflow-app/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: videoflow-app/src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: videoflow-app/sidecar/requirements.txt

      # Build engine exe thật để test spawn_sidecar đi qua đường browser (Edge có sẵn
      # trên windows-latest) thay vì chỉ mock driver.
      - name: Build sidecar engine for spawn test
        working-directory: videoflow-app/sidecar
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pyinstaller muse2api.spec --distpath ../src-tauri/binaries --workpath build --noconfirm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (gồm spawn engine thật + browser driver)
        run: cargo test -- --nocapture

      - name: Engine browser-path smoke (Edge headless)
        shell: pwsh
        run: |
          $exe = "binaries/videoflow-muse-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $exe)) { throw "Thiếu $exe" }

          # windows-latest có Edge nhưng không nằm trên PATH — dò các vị trí chuẩn.
          # Lưu ý cú pháp: biến có ngoặc phải viết ${env:ProgramFiles(x86)}.
          $candidates = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "$env:LOCALAPPDATA\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          if (-not $candidates) {
            Write-Host "::warning::Runner không có Edge/Chrome — bỏ qua smoke browser driver (đã có test spawn ở bước Tests)."
            exit 0
          }
          $browser = $candidates[0]
          Write-Host "browser: $browser"

          $dataDir = "$env:TEMP\m2a-ci-browser"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $stdoutLog = "$dataDir\engine-stdout.log"
          $stderrLog = "$dataDir\engine-stderr.log"
          $env:MUSE2API_DRIVER = "browser"
          $env:MUSE2API_PORT = "18703"
          $env:MUSE2API_CDP_PORT = "19203"
          $env:MUSE2API_DATA_DIR = $dataDir
          $env:MUSE2API_API_KEY = "bkey"
          $env:MUSE2API_ADMIN_KEY = "bkey"
          $env:MUSE2API_HEADLESS = "true"
          $env:MUSE2API_CHROMIUM_PATH = $browser
          $dumpLogs = {
            $out = Get-Content -LiteralPath $stdoutLog -Raw -Encoding UTF8 -ErrorAction SilentlyContinue
            $err = Get-Content -LiteralPath $stderrLog -Raw -Encoding UTF8 -ErrorAction SilentlyContinue
            $ce = if (Test-Path -LiteralPath $dataDir) {
              (Get-ChildItem -LiteralPath $dataDir -Filter "chromium-stderr.log" -Recurse -File -ErrorAction SilentlyContinue |
                ForEach-Object { "=== $($_.FullName) ===`n" + (Get-Content -LiteralPath $_.FullName -Raw -Encoding UTF8 -ErrorAction SilentlyContinue) }) -join "`n"
            } else { "" }
            "`n--- engine stdout ---`n$out`n--- engine stderr ---`n$err`n--- chromium ---`n$ce"
          }
          $p = Start-Process -FilePath $exe -PassThru -NoNewWindow -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog
          function Stop-PidTree([int]$targetPid, [System.Diagnostics.Process]$proc = $null) {
            $prevEap = $ErrorActionPreference
            try {
              $ErrorActionPreference = "Continue"
              & taskkill /PID $targetPid /T /F 2>&1 | Out-Null
              if ($proc) { $proc.Refresh() }
              if ($LASTEXITCODE -in @(0, 128) -or ($proc -and $proc.HasExited)) {
                $global:LASTEXITCODE = 0
              }
            } finally {
              $ErrorActionPreference = $prevEap
            }
          }
          try {
            $ok = $false
            foreach ($i in 1..150) {
              Start-Sleep -Milliseconds 500
              if ($p.HasExited) {
                throw ("engine thoát sớm (exit $($p.ExitCode))" + (& $dumpLogs))
              }
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:18703/healthz" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) {
              throw ("engine browser driver không lên được trong 75s" + (& $dumpLogs))
            }
            try {
              $h = @{ Authorization = "Bearer bkey" }
              $st = Invoke-RestMethod -Uri "http://127.0.0.1:18703/admin/status" -Headers $h
              if ($st.driver.driver -ne "browser") { throw "driver sai: $($st.driver.driver)" }
              if (-not $st.driver.ok) { throw "browser driver không OK: $($st.driver | ConvertTo-Json -Compress)" }
              Write-Host "browser driver OK: tabs=$($st.driver.tabs) busy=$($st.driver.busy_tabs)"
            } catch {
              throw ($_.Exception.Message + (& $dumpLogs))
            }
          } finally {
            if ($p) {
              $p.Refresh()
              if (-not $p.HasExited) {
                Stop-PidTree $p.Id $p
              }
            }
            Get-CimInstance Win32_Process -Filter "Name='msedge.exe' OR Name='chrome.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -and $_.CommandLine.IndexOf($dataDir, [System.StringComparison]::OrdinalIgnoreCase) -ge 0 } |
              ForEach-Object { Stop-PidTree $_.ProcessId }
          }

  sidecar:
    name: Sidecar (python syntax + mock API smoke)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: videoflow-app/sidecar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pip install -r requirements.txt -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile all sources
        run: python -m compileall -q muse2api

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Unit tests (quota, pool lease, duplicate session, vm disabled)
        run: python -m pytest -q

      - name: Smoke test (mock driver)
        shell: pwsh
        run: |
          $env:MUSE2API_DRIVER = "mock"
          $env:MUSE2API_PORT = "18699"
          $env:MUSE2API_DATA_DIR = "$env:TEMP\m2a-ci"
          $env:MUSE2API_API_KEY = "cikey"
          $env:MUSE2API_ADMIN_KEY = "cikey"
          $p = Start-Process -FilePath python -ArgumentList "-m", "muse2api" -PassThru -NoNewWindow
          try {
            $ok = $false
            foreach ($i in 1..40) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:18699/healthz" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "sidecar /healthz không sẵn sàng" }

            $h = @{ Authorization = "Bearer cikey" }
            $status = Invoke-RestMethod -Uri "http://127.0.0.1:18699/admin/status" -Headers $h
            if ($status.driver.driver -ne "mock") { throw "driver sai: $($status.driver.driver)" }

            # Fix 3: chặn import trùng session
            $body = '{"label":"a1","cookies":{"hatch_sess":"dup123","hatch_native_auth_device":"dev1"}}'
            $null = Invoke-RestMethod -Uri "http://127.0.0.1:18699/admin/accounts" -Method Post `
              -Headers $h -ContentType "application/json" -Body $body
            $dupFailed = $false
            try {
              Invoke-RestMethod -Uri "http://127.0.0.1:18699/admin/accounts" -Method Post `
                -Headers $h -ContentType "application/json" -Body $body
            } catch { $dupFailed = $true }
            if (-not $dupFailed) { throw "cookie trùng session KHÔNG bị chặn" }
          } finally {
            if ($p) {
              $p.Refresh()
              if (-not $p.HasExited) {
                $prevEap = $ErrorActionPreference
                try {
                  $ErrorActionPreference = "Continue"
                  & taskkill /PID $($p.Id) /T /F 2>&1 | Out-Null
                  $p.Refresh()
                  if ($LASTEXITCODE -in @(0, 128) -or $p.HasExited) {
                    $global:LASTEXITCODE = 0
                  }
                } finally {
                  $ErrorActionPreference = $prevEap
                }
              }
            }
          }
