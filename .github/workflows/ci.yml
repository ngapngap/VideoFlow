name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (svelte-check + build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: videoflow-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: videoflow-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build frontend
        run: npm run build

  rust:
    name: Rust (clippy + tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: videoflow-app/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: videoflow-app/src-tauri

      # tauri build script cần file externalBin tồn tại (sidecar thật chỉ build ở job release)
      - name: Stub sidecar binary
        shell: bash
        run: |
          touch binaries/videoflow-muse-x86_64-pc-windows-msvc.exe

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  sidecar:
    name: Sidecar (python syntax + mock API smoke)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: videoflow-app/sidecar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.115" "uvicorn[standard]>=0.32" "pydantic>=2.9" "pydantic-settings>=2.5" "httpx[socks]>=0.27" "websockets>=13.0" "python-multipart>=0.0.9"

      - name: Compile all sources
        run: python -m compileall -q muse2api

      - name: Smoke test (mock driver)
        shell: pwsh
        run: |
          $env:MUSE2API_DRIVER = "mock"
          $env:MUSE2API_PORT = "18699"
          $env:MUSE2API_DATA_DIR = "$env:TEMP\m2a-ci"
          $env:MUSE2API_API_KEY = "cikey"
          $env:MUSE2API_ADMIN_KEY = "cikey"
          Start-Process -FilePath python -ArgumentList "-m", "muse2api" -NoNewWindow
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Milliseconds 500
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:18699/healthz" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          if (-not $ok) { throw "sidecar /healthz không sẵn sàng" }

          $h = @{ Authorization = "Bearer cikey" }
          $status = Invoke-RestMethod -Uri "http://127.0.0.1:18699/admin/status" -Headers $h
          if ($status.driver.driver -ne "mock") { throw "driver sai: $($status.driver.driver)" }

          # Fix 3: chặn import trùng session
          $body = '{"label":"a1","cookies":{"hatch_sess":"dup123","hatch_native_auth_device":"dev1"}}'
          $null = Invoke-RestMethod -Uri "http://127.0.0.1:18699/admin/accounts" -Method Post `
            -Headers $h -ContentType "application/json" -Body $body
          $dupFailed = $false
          try {
            Invoke-RestMethod -Uri "http://127.0.0.1:18699/admin/accounts" -Method Post `
              -Headers $h -ContentType "application/json" -Body $body
          } catch { $dupFailed = $true }
          if (-not $dupFailed) { throw "cookie trùng session KHÔNG bị chặn" }

          Stop-Process -Name python -Force -ErrorAction SilentlyContinue
