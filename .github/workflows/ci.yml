name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (svelte-check + build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: videoflow-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: videoflow-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build frontend
        run: npm run build

  rust:
    name: Rust (clippy + tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: videoflow-app/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: videoflow-app/src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: videoflow-app/sidecar/requirements.txt

      # Build engine exe thật để test spawn_sidecar đi qua đường browser (Edge có sẵn
      # trên windows-latest) thay vì chỉ mock driver.
      - name: Build sidecar engine for spawn test
        working-directory: videoflow-app/sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pyinstaller muse2api.spec --distpath ../src-tauri/binaries --workpath build --noconfirm

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (gồm spawn engine thật + browser driver)
        run: cargo test -- --nocapture

      - name: Engine browser-path smoke (Edge headless)
        shell: pwsh
        run: |
          $exe = "binaries/videoflow-muse-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $exe)) { throw "Thiếu $exe" }
          $env:MUSE2API_DRIVER = "browser"
          $env:MUSE2API_PORT = "18703"
          $env:MUSE2API_CDP_PORT = "19203"
          $env:MUSE2API_DATA_DIR = "$env:TEMP\m2a-ci-browser"
          $env:MUSE2API_API_KEY = "bkey"
          $env:MUSE2API_ADMIN_KEY = "bkey"
          $env:MUSE2API_HEADLESS = "true"
          $env:MUSE2API_CHROMIUM_PATH = (Get-Command msedge.exe -ErrorAction SilentlyContinue).Source
          $p = Start-Process -FilePath $exe -PassThru -NoNewWindow
          $ok = $false
          foreach ($i in 1..120) {
            Start-Sleep -Milliseconds 500
            if ($p.HasExited) { throw "engine thoát sớm: $((Get-Content "$env:TEMP\m2a-ci-browser\engine-stderr.log" -Raw -ErrorAction SilentlyContinue))" }
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:18703/healthz" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          if (-not $ok) { throw "engine browser driver không lên được" }
          $h = @{ Authorization = "Bearer bkey" }
          $st = Invoke-RestMethod -Uri "http://127.0.0.1:18703/admin/status" -Headers $h
          if ($st.driver.driver -ne "browser") { throw "driver sai: $($st.driver.driver)" }
          if (-not $st.driver.ok) { throw "browser driver không OK: $($st.driver)" }
          Write-Host "browser driver OK: tabs=$($st.driver.tabs) busy=$($st.driver.busy_tabs)"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

  sidecar:
    name: Sidecar (python syntax + mock API smoke)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: videoflow-app/sidecar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Compile all sources
        run: python -m compileall -q muse2api

      - name: Unit tests (quota enforcement, duplicate session, vm disabled)
        run: python -m pytest -q

      - name: Smoke test (mock driver)
        shell: pwsh
        run: |
          $env:MUSE2API_DRIVER = "mock"
          $env:MUSE2API_PORT = "18699"
          $env:MUSE2API_DATA_DIR = "$env:TEMP\m2a-ci"
          $env:MUSE2API_API_KEY = "cikey"
          $env:MUSE2API_ADMIN_KEY = "cikey"
          Start-Process -FilePath python -ArgumentList "-m", "muse2api" -NoNewWindow
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Milliseconds 500
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:18699/healthz" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          if (-not $ok) { throw "sidecar /healthz không sẵn sàng" }

          $h = @{ Authorization = "Bearer cikey" }
          $status = Invoke-RestMethod -Uri "http://127.0.0.1:18699/admin/status" -Headers $h
          if ($status.driver.driver -ne "mock") { throw "driver sai: $($status.driver.driver)" }

          # Fix 3: chặn import trùng session
          $body = '{"label":"a1","cookies":{"hatch_sess":"dup123","hatch_native_auth_device":"dev1"}}'
          $null = Invoke-RestMethod -Uri "http://127.0.0.1:18699/admin/accounts" -Method Post `
            -Headers $h -ContentType "application/json" -Body $body
          $dupFailed = $false
          try {
            Invoke-RestMethod -Uri "http://127.0.0.1:18699/admin/accounts" -Method Post `
              -Headers $h -ContentType "application/json" -Body $body
          } catch { $dupFailed = $true }
          if (-not $dupFailed) { throw "cookie trùng session KHÔNG bị chặn" }

          Stop-Process -Name python -Force -ErrorAction SilentlyContinue
