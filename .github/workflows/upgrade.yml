name: Verify installed Desktop upgrade
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official previous release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $base = "https://github.com/${{ github.repository }}/releases/latest/download"
          $manifest = Invoke-RestMethod "$base/latest.json"
          if ($manifest.version.TrimStart('v') -ne '1.6.0') { throw "Wrong updater manifest $($manifest.version)" }
          $target = $manifest.platforms.'windows-x86_64'
          if (-not $target.url -or -not $target.signature) { throw "Missing Windows signed update" }
          $sig = (Invoke-RestMethod "$($target.url).sig").Trim()
          if ($sig -cne $target.signature.Trim()) { throw "Manifest signature differs from published .sig" }
          gh release download v1.5.5 --pattern '*_x64-setup.exe' --dir "$env:RUNNER_TEMP/previous"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $installer = Get-ChildItem "$env:RUNNER_TEMP/previous" -Filter '*.exe'
          $result = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru -Wait
          if ($result.ExitCode) { throw "NSIS exit code $($result.ExitCode)" }
          python -m pip install websockets==16.0
      - name: Upgrade through the 1.5.5 WebView and verify installed 1.6.0
        run: python .github/scripts/test-installed-update.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: installed-update-1.5.5-to-1.6.0
          path: reels-after-update.png
