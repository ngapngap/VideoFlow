name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version để build (chỉ dùng khi chạy tay, vd 1.4.0)"
        required: false

permissions:
  contents: write

# Hai tag liên tiếp không được publish song song (latest.json sẽ là của job xong sau).
concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  # Cổng chất lượng: release chỉ build khi CI xanh trên đúng commit được tag.
  verify:
    name: Verify source (svelte-check, clippy, tests, pytest, ruff)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: videoflow-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: videoflow-app/src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            videoflow-app/sidecar/requirements.txt
            videoflow-app/sidecar/requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: videoflow-app
        run: npm ci

      - name: Frontend type check
        working-directory: videoflow-app
        run: npm run check

      - name: Frontend unit tests
        working-directory: videoflow-app
        run: npm test

      # tauri build script đòi file externalBin tồn tại; verify chỉ cần compile/test
      # nên dùng stub rỗng (bản thật do job `build` tạo sau khi verify xanh).
      - name: Stub sidecar binary
        shell: bash
        working-directory: videoflow-app/src-tauri
        run: |
          mkdir -p binaries
          touch binaries/videoflow-muse-x86_64-pc-windows-msvc.exe

      - name: Rust clippy
        working-directory: videoflow-app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: videoflow-app/src-tauri
        run: cargo test

      - name: Install sidecar dependencies
        working-directory: videoflow-app/sidecar
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pip install -r requirements.txt -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sidecar lint (ruff)
        working-directory: videoflow-app/sidecar
        run: ruff check .

      - name: Sidecar unit tests (pytest)
        working-directory: videoflow-app/sidecar
        run: python -m pytest -q

  build:
    name: Build & publish Windows release
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="${INPUT_VERSION#v}"
          fi
          if [ -z "$V" ]; then echo "::error::Thiếu version"; exit 1; fi
          # Bắt tag sai định dạng TRƯỚC khi ghi vào Cargo.toml/tauri.conf.json.
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version không hợp lệ: '$V' (cần dạng 1.4.1 hoặc 1.4.1-beta.1)"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      - name: Sync version into manifests
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $pkg = "videoflow-app/package.json"
          $j = Get-Content $pkg -Raw | ConvertFrom-Json
          $j.version = $v
          $j | ConvertTo-Json -Depth 20 | Set-Content $pkg -Encoding utf8

          $cargo = "videoflow-app/src-tauri/Cargo.toml"
          $c = Get-Content $cargo -Raw
          $c = [regex]::Replace($c, '(?m)^version = "[^"]+"', "version = `"$v`"", 1)
          Set-Content $cargo $c -Encoding utf8

          $conf = "videoflow-app/src-tauri/tauri.conf.json"
          $cj = Get-Content $conf -Raw | ConvertFrom-Json
          $cj.version = $v
          $cj | ConvertTo-Json -Depth 20 | Set-Content $conf -Encoding utf8

          $pyInit = "videoflow-app/sidecar/muse2api/__init__.py"
          if (Test-Path $pyInit) {
            $pi = Get-Content $pyInit -Raw
            $pi = [regex]::Replace($pi, '(?m)^__version__\s*=\s*"[^"]+"', "__version__ = `"$v`"", 1)
            Set-Content $pyInit $pi -Encoding utf8
          }

          $pyProj = "videoflow-app/sidecar/pyproject.toml"
          if (Test-Path $pyProj) {
            $pp = Get-Content $pyProj -Raw
            $pp = [regex]::Replace($pp, '(?m)^version\s*=\s*"[^"]+"', "version = `"$v`"", 1)
            Set-Content $pyProj $pp -Encoding utf8
          }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: videoflow-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: videoflow-app/src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sidecar engine (PyInstaller onefile)
        working-directory: videoflow-app/sidecar
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pyinstaller muse2api.spec --distpath ../src-tauri/binaries --workpath build --noconfirm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify sidecar artifact
        shell: pwsh
        run: |
          $f = "videoflow-app/src-tauri/binaries/videoflow-muse-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $f)) { throw "Thiếu $f" }
          $item = Get-Item $f
          $mb = [math]::Round($item.Length / 1MB, 1)
          if ($item.Length -lt 8MB) { throw "Sidecar quá nhỏ ($mb MB) — thiếu hidden import?" }
          $sha = (Get-FileHash $f -Algorithm SHA256).Hash
          Write-Host "sidecar: $mb MB  sha256=$sha"

      # Chạy exe PyInstaller với BROWSER driver thật — PyInstaller không tự thấy
      # `muse2api.drivers.browser.*` (phải khai báo hiddenimports trong .spec); smoke mock
      # không bao giờ import module đó nên hidden import vỡ sẽ lọt tới tay người dùng.
      # Hai step ĐỘC LẬP (khác port, khác data dir) — không phụ thuộc việc engine cũ đã
      # nhả port hay chưa, và mỗi step tự dọn process của mình trong `finally`.
      - name: Smoke 1/2 — browser driver thật (hidden import + Edge headless)
        shell: pwsh
        run: |
          $exe = "videoflow-app/src-tauri/binaries/videoflow-muse-x86_64-pc-windows-msvc.exe"
          $browser = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "$env:LOCALAPPDATA\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $browser) {
            Write-Host "::warning::Runner không có Edge — phase browser bị bỏ (CI Rust job đã test spawn engine thật)."
            exit 0
          }
          $dataDir = "$env:TEMP\m2a-rel-browser"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $env:MUSE2API_DRIVER = "browser"
          $env:MUSE2API_PORT = "18701"
          $env:MUSE2API_CDP_PORT = "19207"
          $env:MUSE2API_DATA_DIR = $dataDir
          $env:MUSE2API_API_KEY = "relkey"
          $env:MUSE2API_ADMIN_KEY = "relkey"
          $env:MUSE2API_HEADLESS = "true"
          $env:MUSE2API_CHROMIUM_PATH = $browser
          $h = @{ Authorization = "Bearer relkey" }
          $p = Start-Process -FilePath $exe -PassThru -NoNewWindow -RedirectStandardOutput "$dataDir\engine-stdout.log" -RedirectStandardError "$dataDir\engine-stderr.log"
          function Get-SmokeLogs([string]$dir) {
            $outLog = Get-Content -LiteralPath "$dir\engine-stdout.log" -Raw -Encoding UTF8 -ErrorAction SilentlyContinue
            $errLog = Get-Content -LiteralPath "$dir\engine-stderr.log" -Raw -Encoding UTF8 -ErrorAction SilentlyContinue
            $ce = if (Test-Path -LiteralPath $dir) {
              (Get-ChildItem -LiteralPath $dir -Filter "chromium-stderr.log" -Recurse -File -ErrorAction SilentlyContinue |
                ForEach-Object { "=== $($_.FullName) ===`n" + (Get-Content -LiteralPath $_.FullName -Raw -Encoding UTF8 -ErrorAction SilentlyContinue) }) -join "`n"
            } else { "" }
            return "--- engine stderr ---`n$errLog`n--- engine stdout ---`n$outLog`n--- chromium ---`n$ce"
          }
          function Stop-PidTree([int]$targetPid, [System.Diagnostics.Process]$proc = $null) {
            $prevEap = $ErrorActionPreference
            try {
              $ErrorActionPreference = "Continue"
              & taskkill /PID $targetPid /T /F 2>&1 | Out-Null
              if ($proc) { $proc.Refresh() }
              if ($LASTEXITCODE -in @(0, 128) -or ($proc -and $proc.HasExited)) {
                $global:LASTEXITCODE = 0
              }
            } finally {
              $ErrorActionPreference = $prevEap
            }
          }
          try {
            $ok = $false
            foreach ($i in 1..180) {
              Start-Sleep -Milliseconds 500
              if ($p.HasExited) {
                $logs = Get-SmokeLogs $dataDir
                throw "engine thoát sớm (exit $($p.ExitCode))`n$logs"
              }
              try {
                if ((Invoke-WebRequest -Uri "http://127.0.0.1:18701/healthz" -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) {
              $logs = Get-SmokeLogs $dataDir
              throw "engine browser không lên trong 90s`n$logs"
            }
            try {
              $st = Invoke-RestMethod -Uri "http://127.0.0.1:18701/admin/status" -Headers $h
              Write-Host "browser: driver=$($st.driver.driver) ok=$($st.driver.ok) tabs=$($st.driver.tabs)"
              if ($st.driver.driver -ne "browser") { throw "driver sai: $($st.driver.driver)" }
              if (-not $st.driver.ok) { throw "browser driver không OK: $($st.driver | ConvertTo-Json -Compress)" }
            } catch {
              $logs = Get-SmokeLogs $dataDir
              throw "$($_.Exception.Message)`n$logs"
            }
          } finally {
            if ($p) {
              $p.Refresh()
              if (-not $p.HasExited) {
                Stop-PidTree $p.Id $p
              }
            }
            Get-CimInstance Win32_Process -Filter "Name='msedge.exe' OR Name='chrome.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -and $_.CommandLine.IndexOf($dataDir, [System.StringComparison]::OrdinalIgnoreCase) -ge 0 } |
              ForEach-Object { Stop-PidTree $_.ProcessId }
          }

      - name: Smoke 2/2 — contract VideoFlow (mock driver, video + ảnh)
        shell: pwsh
        run: |
          $exe = "videoflow-app/src-tauri/binaries/videoflow-muse-x86_64-pc-windows-msvc.exe"
          $dataDir = "$env:TEMP\m2a-rel-mock"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $env:MUSE2API_DRIVER = "mock"
          $env:MUSE2API_PORT = "18702"
          $env:MUSE2API_DATA_DIR = $dataDir
          $env:MUSE2API_API_KEY = "relkey"
          $env:MUSE2API_ADMIN_KEY = "relkey"
          $h = @{ Authorization = "Bearer relkey" }
          $base = "http://127.0.0.1:18702"
          $tmp = $null
          $p = Start-Process -FilePath $exe -PassThru -NoNewWindow -RedirectStandardOutput "$dataDir\engine-stdout.log" -RedirectStandardError "$dataDir\engine-stderr.log"
          function Get-MockSmokeLogs([string]$dir) {
            $err = Get-Content -LiteralPath "$dir\engine-stderr.log" -Raw -Encoding UTF8 -ErrorAction SilentlyContinue
            $out = Get-Content -LiteralPath "$dir\engine-stdout.log" -Raw -Encoding UTF8 -ErrorAction SilentlyContinue
            return "--- stderr ---`n$err`n--- stdout ---`n$out"
          }
          try {
            $ok = $false
            foreach ($i in 1..120) {
              Start-Sleep -Milliseconds 500
              if ($p.HasExited) {
                $logs = Get-MockSmokeLogs $dataDir
                throw "engine mock thoát sớm (exit $($p.ExitCode))`n$logs"
              }
              try {
                if ((Invoke-WebRequest -Uri "$base/healthz" -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) {
              $logs = Get-MockSmokeLogs $dataDir
              throw "engine mock không lên trong 60s`n$logs"
            }

            try {
              $st = Invoke-RestMethod -Uri "$base/admin/status" -Headers $h
              Write-Host "mock: driver=$($st.driver.driver) ok=$($st.driver.ok)"
              if ($st.driver.driver -ne "mock") { throw "driver sai: $($st.driver.driver)" }

              $research = Invoke-RestMethod "$base/internal/research/search_list" -Method Post -Headers $h -ContentType "application/json" -Body '{"limit":20}'
              if (-not $research.ok -or $null -eq $research.data.items) { throw "Missing packaged Reels research service" }

              # /v1/models phải có model VideoFlow dùng
              $models = Invoke-RestMethod -Uri "$base/v1/models" -Headers $h
              $ids = @($models.data | ForEach-Object { $_.id })
              foreach ($need in @("muse-video", "muse-image")) {
                if ($ids -notcontains $need) { throw "thiếu model $need trong /v1/models: $($ids -join ',')" }
              }
              Write-Host "models ok: $($ids -join ', ')"

              # account giả để mock gateway có account phục vụ (mock driver không có quota)
              $body = '{"label":"smoke","cookies":{"hatch_sess":"smoke_sess","hatch_native_auth_device":"smoke_dev"}}'
              $null = Invoke-RestMethod -Uri "$base/admin/accounts" -Method Post -Headers $h -ContentType "application/json" -Body $body

              # Video: create → poll → download
              $task = Invoke-RestMethod -Uri "$base/v1/videos" -Method Post -Headers $h `
                -ContentType "application/json" -Body '{"prompt":"smoke","seconds":5}'
              if (-not $task.id) { throw "/v1/videos không trả task id" }
              $polled = $null
              foreach ($i in 1..40) {
                Start-Sleep -Milliseconds 500
                $polled = Invoke-RestMethod -Uri "$base/v1/videos/$($task.id)" -Headers $h
                if ($polled.status -in @("succeeded", "failed")) { break }
              }
              Write-Host "video: $($polled.status)"
              if ($polled.status -ne "succeeded") { throw "video task $($polled.status): $($polled.error)" }
              if (-not $polled.result.url) { throw "video thiếu result.url" }
              $media = Invoke-WebRequest -Uri $polled.result.url -UseBasicParsing -TimeoutSec 30
              if ($media.StatusCode -ne 200) { throw "tải media lỗi $($media.StatusCode)" }
              Write-Host "media ok: $($media.RawContentLength) bytes"

              # Ảnh: multipart /v1/images/edits (đúng shape adapters.rs gửi)
              $png = [Convert]::FromBase64String("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8DwHwAFAAH/q842iQAAAABJRU5ErkJggg==")
              $tmp = Join-Path $env:TEMP "vf-ref.png"
              [IO.File]::WriteAllBytes($tmp, $png)
              $form = @{ prompt="smoke image"; model="muse-image"; n="1"; response_format="b64_json"; image=(Get-Item $tmp) }
              $img = Invoke-RestMethod -Uri "$base/v1/images/edits" -Method Post -Headers $h -Form $form
              if (-not $img.data[0].b64_json) { throw "/v1/images/edits không trả b64_json" }
              Write-Host "image ok: $($img.data[0].b64_json.Length) chars"
            } catch {
              $logs = Get-MockSmokeLogs $dataDir
              throw "$($_.Exception.Message)`n$logs"
            }
          } finally {
            if ($p) {
              $p.Refresh()
              if (-not $p.HasExited) {
                $prevEap = $ErrorActionPreference
                try {
                  $ErrorActionPreference = "Continue"
                  & taskkill /PID $($p.Id) /T /F 2>&1 | Out-Null
                  $p.Refresh()
                  if ($LASTEXITCODE -in @(0, 128) -or $p.HasExited) {
                    $global:LASTEXITCODE = 0
                  }
                } finally {
                  $ErrorActionPreference = $prevEap
                }
              }
            }
            if ($tmp) { Remove-Item -LiteralPath $tmp -ErrorAction SilentlyContinue }
          }

      - name: Install frontend deps
        working-directory: videoflow-app
        run: npm ci

      - name: Verify updater signing key secret
        shell: pwsh
        env:
          SIGN_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGN_KEY)) {
            throw "Thiếu GitHub Secret TAURI_SIGNING_PRIVATE_KEY — bản phát hành bắt buộc phải ký updater (.sig)."
          }

      - name: Build & publish (NSIS + updater artifacts + latest.json)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: videoflow-app
          tagName: v${{ steps.ver.outputs.version }}
          releaseName: "VideoFlow Desktop v${{ steps.ver.outputs.version }}"
          releaseBody: |
            Bản phát hành VideoFlow Desktop v${{ steps.ver.outputs.version }}.

            - Bộ cài NSIS (64-bit) cho Windows
            - Tự cập nhật trong app (Cài đặt → kiểm tra cập nhật ở thanh trạng thái)
            - Kèm engine VideoFlow Muse (muse.ai: tạo ảnh + video bằng cookie)
          # Tự động publish release ngay khi build & verify thành công.
          # Đổi lại thành true nếu muốn giữ ở trạng thái Draft để kiểm tra thủ công trước.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target x86_64-pc-windows-msvc

  upgrade-from-155:
    name: Installed Desktop update 1.5.5 to 1.6.0
    if: github.ref == 'refs/tags/v1.6.0'
    needs: build
    uses: ./.github/workflows/upgrade.yml
