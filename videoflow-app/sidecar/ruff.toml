# Lint engine. Chạy: ruff check .
line-length = 100
target-version = "py310"
exclude = ["build", "dist", "web"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
ignore = [
  "E501",  # line length do formatter lo
  "B008",  # FastAPI Depends() trong default arg là pattern chuẩn
]

[lint.per-file-ignores]
"tests/*" = ["B011"]
